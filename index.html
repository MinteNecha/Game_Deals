<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Game Deals</h1>

    <div class="controls">
        <input id="search-input" type="text" placeholder="Search games">
        <div class="checkbox-wrapper">
            <input type="checkbox" id="on-sale-only">
            <label for="on-sale-only">On Sale Only</label>
        </div>
    </div>

    <div id="games-list"></div>

    <section class="external-section">
        <h2>Games from CheapShark</h2>
        <p class="section-note">Live data pulled from the CheapShark API</p>
        <div id="cheapshark-list"></div>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
