<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="hero">
        <h1>Game Deals</h1>
        <p class="tagline">Find the best prices across your favourite stores</p>
    </header>

    <div class="controls">
        <input id="search-input" type="text" placeholder="Search games">
        <label class="toggle">
            <input type="checkbox" id="on-sale-only">
            <span class="toggle-slider"></span>
            <span class="toggle-label">On Sale Only</span>
        </label>
    </div>

    <div id="games-list"></div>

    <section class="external-section">
        <h2>Games from CheapShark</h2>
        <p class="section-note">Live data pulled from the CheapShark API</p>
        <div id="cheapshark-list"></div>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
